[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fed-h10"
version = "0.6.0"
description = "The Federal Reserve Board's H.10 foreign exchange rates, weekly, into an Open Meridian deployment's lake"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else, pinned exactly: the sidecar this runs beside
# speaks one version of the contract (v18), and a range would let a rebuild
# pick up another. The Dockerfile's base is the same version. The Board's
# pages are read with the standard library: no third-party dependency.
dependencies = [
  "open-meridian==0.31.0",
]

[project.urls]
Repository = "https://github.com/open-meridian/plugin-fed-h10"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "mypy>=1.11",
  "ruff>=0.6",
]

[project.scripts]
fed-h10 = "fed_h10.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# The pages' templates and the Board's recorded responses, installed beside
# the code that reads them.
[tool.setuptools.package-data]
fed_h10 = ["templates/*.html", "responses/*.gz", "responses/index.json"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list -- compliance, confirmation,
# connectivity, custody, data, ems, oms, operations, portfolio, reporting,
# servicing, settlement, signal -- and its grants are theirs. `data`, a data
# plugin (`dgm` until contract v20): it records prices into the lake and
# answers the lake's wants, W10's steps.
roles = ["data"]
# Whether it serves a page through its sidecar.
interface = true
# Its declaration (contract v20): its catalogue, its storage and its setting.
# Upload reads it from the built image with `meridian-declaration`.
declaration = "fed_h10.declaration:DECLARATION"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["fed_h10"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# The SDK's gRPC stubs have no types (meridian-python's own configuration
# says the same).
[[tool.mypy.overrides]]
module = [
    "meridian.v1.sidecar_pb2_grpc",
    "meridian.v1.envelope_pb2_grpc",
    "meridian.plugin.v1.operations_pb2_grpc",
]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
